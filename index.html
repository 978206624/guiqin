<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>归秦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>
/* 布局：一块 720x1280 的竖屏舞台，整体等比缩放塞进窗口；城镇和战斗是舞台里的两层，界面叠在上面 */
:root{
  color-scheme:dark;
  --ink:#0d0a18; --panel:rgba(22,15,38,.8); --panel-solid:#1a122c;
  --gold:#e2b04a; --gold-hi:#fff0b8; --gold-lo:#8a5a14;
  --text:#f4ecda; --muted:#a99db4; --jade:#8ff08a; --sky:#9fe0ff; --rose:#ffa8d0; --red:#d8402e; --amber:#ffd56a;
  --display:'Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  --body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif;
  --edge:0 0 3px #120a14,0 0 3px #120a14,1px 1px 0 #120a14,-1px 1px 0 #120a14,1px -1px 0 #120a14,-1px -1px 0 #120a14;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;border-radius:10px}
#stage img{max-width:none;-webkit-user-drag:none;pointer-events:none}
.layer{position:absolute;inset:0;isolation:isolate}
.bgimg{position:absolute;left:0;top:0;width:720px;height:1280px}
#town{cursor:pointer}
#world{position:absolute;left:0;top:0;will-change:transform}
#bgMap{position:absolute;left:0;top:0}
#water{position:absolute;left:0;top:0;pointer-events:none}
#fog{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#fog i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(240,246,255,.9),rgba(240,246,255,.5) 45%,rgba(240,246,255,0));will-change:transform,opacity;animation:fogdrift var(--d) ease-in-out infinite alternate}
@keyframes fogdrift{0%{transform:translate3d(calc(var(--dx)*-1),calc(var(--dy)*-1),0) scale(.92);opacity:var(--o1)}100%{transform:translate3d(var(--dx),var(--dy),0) scale(1.08);opacity:var(--o2)}}
.glow{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,100,.55),rgba(255,150,60,0));mix-blend-mode:screen;animation:flick 3s ease-in-out infinite;pointer-events:none}
@keyframes flick{0%,100%{opacity:.25}35%{opacity:.8}60%{opacity:.4}80%{opacity:.7}}
.shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,rgba(10,6,28,.55),rgba(10,6,28,0) 190px),
  linear-gradient(to top,rgba(10,6,28,.85),rgba(10,6,28,0) 300px)}
.fight #town,.fight .townui{display:none}
#battle{display:none}
.fight #battle{display:block}
.fight .fightui{display:block}
.fightui{display:none}

/* 城镇角色 */
.actor{position:absolute;left:0;top:0;width:0;height:0}
.actor .sh,.unit .sh{position:absolute;left:-26px;top:-9px;width:52px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,4,20,.6),rgba(8,4,20,0))}
.actor>*{zoom:1.35}
.actor img{position:absolute;bottom:-4px}
.actor .walk{position:absolute;bottom:-4px;background-repeat:no-repeat;transform-origin:var(--ox) 100%}
.tag{position:absolute;left:-90px;width:180px;text-align:center;font-weight:700;font-size:16px;line-height:1.2;white-space:nowrap;pointer-events:none;text-shadow:var(--edge)}
.tag small{display:block;font-size:13px;font-weight:600}
.tag .auto{display:block;color:var(--amber);font-size:13px}
.tag .mk{display:block;font-size:30px;font-weight:900;line-height:1;color:#ffd23a;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#ring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#ring svg{position:absolute;left:-44px;top:-22px;width:88px;height:44px;overflow:visible}
#mark{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0}
#mark::before{content:"";position:absolute;left:-30px;top:-15px;width:60px;height:30px;border-radius:50%;border:3px solid var(--amber);box-sizing:border-box}
#mark.go{animation:ripple .6s ease-out}
@keyframes ripple{0%{opacity:1;transform:var(--at) scale(.2)}100%{opacity:0;transform:var(--at) scale(1)}}
.petal{position:absolute;left:0;top:0;width:9px;height:5px;border-radius:60% 40% 60% 40%;background:#ffc8dc;pointer-events:none;opacity:.9}
.portal{position:absolute;left:0;top:0;width:0;height:0}
.portal i{position:absolute;left:-34px;top:-17px;width:68px;height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(159,224,255,.75),rgba(159,224,255,0));animation:flick 2s ease-in-out infinite}
.portal .tag{bottom:26px;color:var(--sky)}

/* 界面通用 */
.ui{position:absolute;cursor:default}
.panel{background:linear-gradient(var(--panel),rgba(12,8,22,.74));border:1px solid rgba(226,176,74,.55);border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.btn{position:absolute;border:0;background:none;padding:0;cursor:pointer;color:var(--text);font:inherit;text-align:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));transition:transform .08s}
.btn:active{transform:scale(.92)}
.btn:focus-visible,.tbtn:focus-visible,.tile:focus-visible,.row:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn img{display:block;width:100%;height:auto}
.btn span{display:block;margin-top:-3px;font-size:14px;font-weight:600;text-shadow:var(--edge)}
.btn .dot{position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#ff3a2a;border:2px solid #fff}
.btn.on img{filter:drop-shadow(0 0 8px #ffb04a) brightness(1.15)}
.tbtn{border:1px solid var(--gold);border-radius:8px;background:linear-gradient(#3b2a5c,#1d1433);color:var(--gold-hi);font:inherit;font-size:18px;font-weight:700;padding:8px 14px;cursor:pointer}
.tbtn:active{transform:translateY(1px)}
.tbtn[disabled]{opacity:.4;cursor:default}
.tbtn.red{background:linear-gradient(#a8362e,#5a1418)}

/* 头像栏 */
#hud{left:10px;top:18px;width:420px;height:104px;z-index:3}
#hud .face{cursor:pointer}
#hudPet{position:absolute;left:326px;top:30px;width:62px;height:62px;padding:0;border-radius:50%;border:0;background:linear-gradient(var(--gold-hi),var(--gold) 45%,var(--gold-lo));box-shadow:0 3px 8px rgba(0,0,0,.6);cursor:pointer}
#hudPet img{position:absolute;left:4px;top:4px;width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 30%;background:#2d4a6a}
#hudPet i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#2f5d9a;border:2px solid var(--gold);font-style:normal;font-size:12px;line-height:18px;color:#fff;text-align:center}
#hud .plate{position:absolute;left:46px;top:6px;width:280px;height:92px;background:linear-gradient(var(--panel),rgba(12,8,22,.74));border:1px solid rgba(226,176,74,.5);clip-path:polygon(0 0,93% 0,100% 24%,93% 100%,0 100%)}
#hud .face{position:absolute;left:0;top:2px;width:96px;height:96px;border-radius:50%;background:linear-gradient(var(--gold-hi),var(--gold) 45%,var(--gold-lo));box-shadow:0 3px 8px rgba(0,0,0,.6)}
#hud .face img{position:absolute;left:6px;top:6px;width:84px;height:84px;border-radius:50%;object-fit:cover;background:#3a4f7a}
#hud .lv{position:absolute;left:66px;top:70px;width:30px;height:30px;border-radius:50%;background:#96201c;border:2px solid var(--gold);font-size:14px;font-weight:700;line-height:30px;text-align:center;color:#fff}
#hud .who2{position:absolute;left:108px;top:11px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#hud .name{font-size:19px;font-weight:700;color:#fff3c4}
#hud .sect{padding:1px 8px;border-radius:4px;background:#2f5d9a;border:1px solid #8fc0ff;font-size:12px;color:#e6f2ff}
.bar{position:absolute;left:106px;width:190px;height:14px;border-radius:7px;background:#1a0f14;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);overflow:hidden;font-size:10.5px;line-height:14px;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .35s}
.bar b{position:relative;font-weight:500}
#hp{top:42px} #hp i,.hpb i{background:linear-gradient(#ff8a78,#c0241c)}
#mp{top:60px} #mp i{background:linear-gradient(#84ccff,#2060c0)}
#hud .pow{position:absolute;left:108px;top:78px;font-size:13px;color:#d9c08a}
#hud .pow b{font-size:16px;color:var(--amber);margin-left:4px;font-variant-numeric:tabular-nums}

/* 小地图 */
#mini{left:580px;top:16px;width:124px;height:124px;border-radius:50%;background:linear-gradient(var(--gold-hi),var(--gold) 45%,var(--gold-lo));box-shadow:0 3px 10px rgba(0,0,0,.6)}
#mini .map{position:absolute;inset:7px;border-radius:50%;overflow:hidden;background:#243 no-repeat}
#mini .me{position:absolute;left:55px;top:55px;width:0;height:0;border:6px solid transparent;border-bottom:11px solid #fff;margin:-9px 0 0 -6px;filter:drop-shadow(0 0 2px #000)}
#mini .n{position:absolute;left:50px;top:-8px;width:24px;height:24px;border-radius:50%;background:#96201c;border:2px solid var(--gold);font-size:12px;font-weight:700;line-height:20px;text-align:center;box-sizing:border-box}
#place{left:566px;top:148px;width:152px;height:34px;text-align:center;font-family:var(--display);font-size:22px;line-height:34px;color:#4a2a10;background:linear-gradient(#fbf0cc,#dcc48a);border:1.5px solid var(--gold-lo);border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#place::before,#place::after{content:"";position:absolute;top:-4px;width:9px;height:40px;border-radius:5px;background:#5a2e14}
#place::before{left:-7px} #place::after{right:-7px}
#coin{left:566px;top:188px;width:152px;text-align:center;font-size:14px;font-weight:700;color:var(--amber);text-shadow:var(--edge);font-variant-numeric:tabular-nums}

/* 任务 */
#quest{left:10px;top:136px;width:214px;padding:0 0 8px;cursor:pointer}
#quest h3{margin:0;display:flex;font-size:15px;font-weight:700;border-bottom:1px solid rgba(226,176,74,.5)}
#quest h3 span{flex:1;text-align:center;line-height:30px;color:var(--muted);font-weight:400}
#quest h3 span.on{background:rgba(122,82,22,.9);color:#ffe8a8;font-weight:700;border-radius:9px 0 0 0}
.q{margin:5px 4px 0;padding:5px 8px;border-left:3px solid transparent;border-radius:4px;font-size:15px;line-height:1.35}
.q.cur{background:rgba(226,176,74,.16);border-left-color:var(--amber)}
.q em{font-style:normal;font-weight:700}
.q p{margin:1px 0 0;font-size:13px;color:#d4cabc}
.q.cur p{color:var(--jade);text-decoration:underline}

/* 聊天 / 底栏 */
#chat{left:10px;top:1146px;width:446px;height:122px;font-size:15px;line-height:24px;padding:8px 12px;box-sizing:border-box;overflow:hidden}
#chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat .in{margin-top:5px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);color:var(--muted);font-size:13px;line-height:26px;padding:0 16px}
#exp{left:0;top:1272px;width:720px;height:8px;background:#0a0612;z-index:3}
#exp i{display:block;height:5px;margin-top:1.5px;border-radius:3px;background:linear-gradient(90deg,#8fe06a,#f6e66a);transition:width .6s}

/* 对话与提示 */
.unit .stt{position:absolute;left:-60px;width:120px;bottom:-22px;text-align:center;white-space:nowrap;pointer-events:none}.unit .stt b{display:inline-block;margin:0 2px;padding:0 5px;border-radius:7px;font:400 13px/18px var(--display),sans-serif;color:#fff;box-shadow:0 1px 3px #0008}
#dialog{left:20px;top:986px;width:680px;height:172px;z-index:5;cursor:pointer;background:linear-gradient(rgba(26,17,44,.96),rgba(12,8,22,.96));border:1.5px solid var(--gold)}
#dialog img{position:absolute;left:14px;top:14px;width:118px;height:118px;border-radius:8px;border:2px solid var(--gold);background:#2b2440;object-fit:cover}
#dialog h4{position:absolute;left:150px;top:10px;margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--amber)}
#dialog p{position:absolute;left:150px;top:56px;right:18px;margin:0;font-size:19px;line-height:1.5}
#dialog small{position:absolute;right:16px;bottom:8px;font-size:13px;color:var(--muted)}
#toast{left:60px;top:930px;width:600px;text-align:center;font-size:20px;font-weight:700;color:var(--amber);pointer-events:none;opacity:0;transition:opacity .3s;z-index:9;text-shadow:var(--edge)}
#toast.show{opacity:1}

/* 弹窗（背包 / 角色 / 技能 / 宠物 / 商店 / 关卡 / 结算）*/
#modal{inset:0;z-index:7;background:rgba(8,4,18,.62);display:flex;align-items:center;justify-content:center}
#modal .box{position:relative;width:620px;max-height:1000px;background:linear-gradient(#241a3c,#140d24);border:2px solid var(--gold);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.7);display:flex;flex-direction:column}
#modal h2{margin:0;padding:12px 60px 8px;text-align:center;font-family:var(--display);font-weight:400;font-size:34px;color:var(--amber);border-bottom:1px solid rgba(226,176,74,.45)}
#mClose{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:#3a1418;color:var(--gold-hi);font-size:22px;line-height:1;cursor:pointer}
#mBody{padding:16px 20px 20px;overflow-y:auto;font-size:17px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.05);padding:0;cursor:pointer;font:inherit;color:inherit}
.tile img{width:100%;height:100%;display:block}
.tile.sel{border-color:var(--amber);box-shadow:0 0 10px rgba(255,213,106,.6)}
.tile b{position:absolute;right:5px;bottom:2px;font-size:15px;text-shadow:var(--edge);font-variant-numeric:tabular-nums}
.tile u{position:absolute;left:4px;top:3px;font-size:12px;text-decoration:none;background:var(--red);border-radius:4px;padding:0 4px;color:#fff}
.tile.empty{cursor:default;border:1px dashed rgba(226,176,74,.25)}
.detail{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.28);display:flex;gap:12px;align-items:center;min-height:74px}
.detail div{flex:1;min-width:0}
.detail h5{margin:0;font-size:19px;color:var(--amber)}
.detail p{margin:2px 0 0;font-size:15px;color:#d4cabc}
.row{display:flex;gap:12px;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;margin-top:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(226,176,74,.25);color:inherit;font:inherit;text-align:left}
button.row{cursor:pointer}
button.row[disabled]{opacity:.45;cursor:default}
.row img{width:64px;height:64px;flex:none}
.row div{flex:1;min-width:0}
.row h5{margin:0;font-size:19px;color:var(--amber)}
.row p{margin:1px 0 0;font-size:15px;color:#d4cabc}
.row span{flex:none;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:18px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(226,176,74,.25);padding:3px 0}
.stats b{color:var(--amber);font-variant-numeric:tabular-nums}
.who{display:flex;gap:18px;align-items:flex-end;margin-bottom:14px}
.who>img{height:190px;width:auto;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.who h5{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:#fff3c4}
.who p{margin:2px 0 0;color:var(--muted)}
.who b.gold{color:var(--amber)}.who p.small{font-size:15px}
.rbar{position:relative;height:16px;border-radius:8px;background:#1a0f14;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);overflow:hidden;margin-top:4px}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}.rbar span{position:relative;display:block;text-align:center;font-size:12px;line-height:16px;color:#fff;text-shadow:var(--edge)}
.rbar.hp i{background:linear-gradient(#ff7a7a,#c22d2d)}.rbar.mp i{background:linear-gradient(#7ab6ff,#2d63c2)}.rbar.exp{height:8px}.rbar.exp i{background:linear-gradient(#ffe08a,#d9972a)}
.rtabs{display:flex;gap:8px;margin:2px 0 12px}.rtab{flex:1;font:inherit;font-size:19px;font-weight:700;padding:8px 0;border:1px solid rgba(226,176,74,.35);border-radius:10px;background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer}
.rtab.on{color:var(--gold-hi);border-color:var(--gold);background:linear-gradient(#3b2a5c,#1d1433)}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}.vit small{color:var(--muted);font-size:15px}
.alist{display:flex;flex-direction:column}.arow{display:grid;grid-template-columns:96px 84px 1fr;align-items:baseline;gap:6px;padding:7px 0;border-bottom:1px dashed rgba(226,176,74,.25);font-size:19px}
.arow b{color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}.arow small{color:var(--muted);font-size:14px;line-height:1.3}.arow em{font-style:normal;color:#7ee08a}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.sstar{position:absolute;right:1px;top:1px;font-style:normal;font-size:10px;line-height:13px;padding:0 3px;border-radius:6px;background:rgba(10,6,22,.85);color:#ffd45a;z-index:1}
.gold2{color:#ffd45a}
.fstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}
.fchip{position:relative;aspect-ratio:1;padding:0;border-radius:10px;border:2px solid var(--qc);background:linear-gradient(rgba(255,255,255,.1),rgba(0,0,0,.3));cursor:pointer;color:#fff3c4;font:inherit}
.fchip img{width:100%;height:100%;display:block}.fchip span{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:15px;background:rgba(10,6,22,.78);border-radius:0 0 8px 8px}.fchip i{position:absolute;right:1px;top:1px;font-style:normal;font-size:10px;line-height:13px;padding:0 3px;border-radius:6px;background:rgba(10,6,22,.85);color:#ffd45a}
.fchip.empty{border-style:dashed;opacity:.5}.fchip.empty span{background:none;color:var(--muted);bottom:20px;font-size:12px}.fchip.sel{box-shadow:0 0 0 2px var(--gold-hi),0 0 12px rgba(255,224,138,.55)}.fchip.hi{box-shadow:0 0 8px var(--qc)}
.fcard{display:flex;gap:14px;padding:12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(226,176,74,.25)}
.fstars{display:flex;justify-content:center;gap:2px;margin-top:12px;flex-wrap:wrap}.fs{font-style:normal;font-size:23px;color:rgba(255,255,255,.14);line-height:1}.fs.on{color:#ffd45a;text-shadow:0 0 6px rgba(255,200,60,.7)}.fs.m{margin-right:7px}
.fsub{text-align:center;margin:6px 0 0;color:var(--muted);font-size:15px}.fsub b{color:#7ee08a}
.fcost{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(226,176,74,.2);font-size:16px;color:#fff3c4}.fcost small{color:var(--muted);font-size:13px}.fcost .lack{color:#ff8a78}.fcost b.okc{color:#7ee08a}.fcost b.midc{color:#ffd45a}.fcost b.badc{color:#ff8a78}
.fgems{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fgem{position:relative;aspect-ratio:1;padding:0;border-radius:12px;border:2px solid var(--qc);background:linear-gradient(rgba(255,255,255,.1),rgba(0,0,0,.3));cursor:pointer;color:#fff3c4;font:inherit}

/* 战斗 */
.unit{position:absolute;width:0;height:0;transition:transform .16s ease-out,opacity .5s}
.frozen .unit img,.frozen .sfx,.frozen .castanim{animation-play-state:paused!important}
.unit.mv{transition:transform .12s cubic-bezier(.5,0,.9,.6)}
.unit.ret{transition:transform .26s cubic-bezier(.2,.8,.3,1)}
.unit.kb{transition:transform .07s ease-out}
.unit img{position:absolute;bottom:-4px;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite;animation-delay:var(--ib,0s)}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(.992,1.012)}}
.unit.enemy .nm{color:#ffc9c0}.unit.ally .nm{color:#c9e4ff}
.unit.enemy{cursor:pointer}
.unit .tap{position:absolute}
.unit.dead{opacity:0;pointer-events:none;transition:opacity .7s .35s}
.unit.dead img{animation:die .9s cubic-bezier(.3,.6,.4,1) forwards}
.unit.dead .hpb,.unit.dead .nm,.unit.dead .stt{opacity:0;transition:opacity .2s}
@keyframes die{0%{transform:none;filter:brightness(2.6)}18%{transform:translateX(calc(var(--k,1)*10px)) rotate(calc(var(--k,1)*6deg));filter:brightness(1.6)}100%{transform:translateX(calc(var(--k,1)*34px)) translateY(10px) rotate(calc(var(--k,1)*78deg)) scale(.92);filter:brightness(.7) saturate(.4)}}
.unit.hit img{animation:hit .34s}
.castanim{position:absolute;bottom:-4px;background-size:400% 100%;background-repeat:no-repeat;pointer-events:none}
.unit.cast img{animation:cast .8s linear}
@keyframes cast{0%{transform:none;filter:none}
20%{transform:translateX(calc(var(--d,1)*-5px)) scale(1.04,.93) rotate(calc(var(--d,1)*-3deg));filter:drop-shadow(0 0 6px #ffe08a);animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}
42%{transform:translateX(calc(var(--d,1)*10px)) translateY(-7px) scale(.97,1.07) rotate(calc(var(--d,1)*5deg));filter:drop-shadow(0 0 14px #c79bff);animation-timing-function:ease-out}
62%{transform:translateX(calc(var(--d,1)*7px)) translateY(-4px) scale(1,1.03) rotate(calc(var(--d,1)*3deg));filter:drop-shadow(0 0 12px #ffe08a);animation-timing-function:ease-in-out}
82%{transform:translateX(calc(var(--d,1)*-1px)) scale(1.01,.98);filter:drop-shadow(0 0 5px #ffe08a);animation-timing-function:ease-out}
100%{transform:none;filter:none}}
@keyframes hit{0%{filter:brightness(3.2);transform:scale(1.06,.94)}25%{transform:translateX(calc(var(--k,1)*8px)) scale(.97,1.03);filter:brightness(2) saturate(0)}55%{transform:translateX(calc(var(--k,1)*-4px));filter:brightness(1.3)}100%{filter:none;transform:none}}
.unit.pick::after{content:"";position:absolute;left:-40px;top:-20px;width:80px;height:40px;border-radius:50%;border:3px solid var(--amber);box-sizing:border-box;animation:flick 1s infinite}
.unit.turn::before{content:"";position:absolute;left:-36px;top:-18px;width:72px;height:36px;border-radius:50%;background:radial-gradient(closest-side,rgba(159,224,255,.7),rgba(159,224,255,0))}
.hpb{position:absolute;left:-30px;width:60px;height:7px;border-radius:4px;background:#1a0f14;box-shadow:0 0 0 1px #000;overflow:hidden}
.hpb i{display:block;height:100%;transition:width .3s}
.unit.pet .hpb{left:-22px;width:44px;height:6px}
.unit.ally .hpb i{background:linear-gradient(#8fe0a0,#2f9a50)}
.unit .nm{position:absolute;left:-80px;width:160px;text-align:center;font-size:13px;font-weight:700;text-shadow:var(--edge);white-space:nowrap}
.float{position:absolute;width:200px;margin-left:-100px;text-align:center;font-size:32px;font-weight:900;color:#fff;text-shadow:var(--edge);pointer-events:none;animation:rise .9s ease-out forwards;z-index:2000}
.float.heal{color:var(--jade)} .float.crit{color:var(--amber);font-size:52px;animation:pop 1.05s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 0 12px #ff8a2a,var(--edge)} .float.big{font-size:42px} .float.info{font-size:22px;color:var(--sky)} .float.miss{font-size:26px;color:#cfe8ff;font-style:italic}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:0}12%{transform:translateY(-14px) scale(1.5);opacity:1}28%{transform:translateY(-14px) scale(1.15)}100%{transform:translateY(-84px) scale(1);opacity:0}}
.impact{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;z-index:1999;background:radial-gradient(closest-side,#fff,rgba(255,240,190,.85) 35%,rgba(255,160,60,0) 70%);animation:impact .26s ease-out forwards}
.impact.crit{width:230px;height:230px;margin:-115px 0 0 -115px;background:radial-gradient(closest-side,#fff,rgba(255,210,120,.9) 40%,rgba(255,90,30,0) 72%)}
@keyframes impact{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.15);opacity:0}}
.sndbtn{position:absolute;right:10px;top:150px;z-index:2100;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,8,24,.6);color:#fff;font-size:20px;line-height:1;cursor:pointer}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
.slash{position:absolute;width:150px;height:8px;margin:-4px 0 0 -75px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,#9fe0ff 60%,rgba(159,224,255,0));pointer-events:none;z-index:1999;animation:slash .28s ease-out forwards}
.slash.fire{background:linear-gradient(90deg,rgba(255,200,80,0),#fff3b0 40%,#ff7a2a 60%,rgba(255,90,30,0));height:14px}

/* 技能特效（代码绘制的轻量版，配色与意象参考 kunkunxunqin 道家高清特效：声波环 / 魔雾 / 魂影 / 锁链 / 回春光环 / 天籁音符 / 返魂光柱） */
.sfx{position:absolute;pointer-events:none;z-index:1998;transform:translate(-50%,-50%)}
.sfx.hd{background-size:400% 200%;background-repeat:no-repeat}
.sfx.hd.c4{background-size:200% 200%}
.sfx.wave{width:60px;height:34px;border-radius:50%;border:3px solid #ffe9a8;box-shadow:0 0 14px #c79bff,inset 0 0 12px #8a5cff;animation:sfxwave .6s ease-out forwards}
.sfx.wave.b{animation-delay:.12s;border-color:#d7b8ff;opacity:0}.sfx.wave.c{animation-delay:.24s;border-color:#fff;opacity:0}
.sfx.mist{width:130px;height:90px;border-radius:50%;background:radial-gradient(ellipse,rgba(120,40,200,.85),rgba(60,10,110,.45) 55%,rgba(40,0,80,0) 72%);filter:blur(3px);animation:sfxmist .75s ease-out forwards}
.sfx.soul{width:46px;height:70px;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 35%,#fff,#d6c4ff 45%,rgba(150,110,255,0) 75%);box-shadow:0 0 16px #b69bff;animation:sfxsoul .85s ease-out forwards}
.sfx.chain{width:70px;height:40px;border-radius:50%;border:3px dashed #b9a2ff;box-shadow:0 0 10px #7a52d8;animation:sfxchain .8s ease-out forwards}
.sfx.ring{width:80px;height:44px;border-radius:50%;border:3px solid #9dffc8;box-shadow:0 0 14px #46e6a0,inset 0 0 14px #46e6a0;animation:sfxring .8s ease-out forwards}
.sfx.heal{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,170,210,.55) 40%,rgba(120,255,190,.25) 65%,rgba(120,255,190,0) 75%);animation:sfxheal .8s ease-out forwards}
.sfx.note{font:700 22px/1 serif;color:#ffe08a;text-shadow:0 0 8px #ffb84a,0 0 2px #fff;animation:sfxnote 1s ease-out forwards}
.sfx.revive{width:46px;height:190px;margin-top:-80px;border-radius:50% 50% 20% 20%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,244,190,.95) 40%,rgba(255,210,110,.5) 80%,rgba(255,210,110,0));box-shadow:0 0 22px #ffd36a;animation:sfxrev 1s ease-out forwards}
@keyframes sfxwave{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes sfxmist{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}35%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
@keyframes sfxsoul{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-150%) scale(1.15);opacity:0}}
@keyframes sfxchain{0%{transform:translate(-50%,-50%) scale(2) rotate(0);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(.7) rotate(200deg);opacity:0}}
@keyframes sfxring{0%{transform:translate(-50%,30%) scale(.8);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-170%) scale(1.1);opacity:0}}
@keyframes sfxheal{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@keyframes sfxnote{0%{transform:translate(-50%,0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-90px) scale(1.1);opacity:0}}
@keyframes sfxrev{0%{transform:translate(-50%,-50%) scaleY(.2);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}100%{transform:translate(-50%,-62%) scaleY(1.05);opacity:0}}
@keyframes slash{0%{transform:rotate(var(--r)) scaleX(.1);opacity:0}40%{opacity:1}100%{transform:rotate(var(--r)) scaleX(1.2);opacity:0}}

.rinfo h3{margin:0;font-family:var(--display);font-weight:400;font-size:46px;color:#fff3c4;text-shadow:var(--edge)}
.rinfo p{margin:2px 0 0;font-size:19px;color:var(--gold-hi)}
#fSlots{left:30px;right:30px;top:958px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slot{height:156px;border-radius:12px;border:2px solid rgba(226,176,74,.4);background:linear-gradient(rgba(34,24,58,.92),rgba(18,12,32,.92));color:var(--text);font:inherit;cursor:pointer;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot img{width:74px;height:74px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#2b2440}
.slot span{font-size:20px;font-weight:700}.slot small{font-size:14px;color:var(--muted)}
.slot.on{border-color:var(--amber);box-shadow:0 0 16px rgba(255,213,106,.6)}
.slot.empty{border-style:dashed}.slot.empty i{font-style:normal;font-size:46px;line-height:74px;color:var(--gold)}
#fConfirmDel{top:520px;text-align:center;z-index:2}
#fConfirmDel p{margin:0 0 16px;line-height:1.6}
#fConfirmDel .fbtn{margin:0 8px}
#fGender{left:210px;width:300px;top:108px}
#fClasses{left:30px;right:30px;top:752px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cls{height:96px;border-radius:12px;border:2px solid rgba(226,176,74,.4);background:linear-gradient(rgba(34,24,58,.92),rgba(18,12,32,.92));color:var(--text);font:inherit;font-size:24px;font-family:var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.cls img{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#2b2440}
.cls.on{border-color:var(--amber);box-shadow:0 0 16px rgba(255,213,106,.6)}
.cinfo{left:30px;right:30px;top:866px;height:270px;box-sizing:border-box;padding:14px 20px;border-radius:12px;background:rgba(14,9,26,.82);border:1px solid rgba(226,176,74,.4)}
.cinfo h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--amber)}
.cinfo h3 small{font-family:var(--body);font-size:16px;color:var(--sky);margin-left:12px}
.cinfo p{margin:4px 0 10px;font-size:18px;line-height:1.5;min-height:54px}
#fStats{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;font-size:16px}
#fStats div{display:flex;align-items:center;gap:10px}
#fStats span{flex:none;width:36px;color:var(--gold-hi)}
#fStats i{flex:1;height:10px;border-radius:5px;background:#1a0f14;overflow:hidden}
#fStats b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#e2b04a,#fff0b8)}
#fCreateForm{left:30px;right:30px;top:1156px;display:flex;gap:12px;align-items:center}
#fCreateForm input{flex:1;margin:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (prefers-reduced-motion:reduce){.glow,.tag .mk,.portal i{animation:none}.petal{display:none}}
</style>

</head>
<body>
<div id="fit"><div id="stage">
  <!-- 城镇 -->
  <div class="layer" id="town">
    <div id="world"><img id="bgMap" alt="">
      <div id="glows"></div><div id="fog"></div>
      <div id="ring"><svg viewBox="-44 -22 88 44"><ellipse rx="40" ry="20" fill="rgba(143,230,255,.14)" stroke="#a8f0ff" stroke-width="2" stroke-dasharray="12 7"><animate attributeName="stroke-dashoffset" from="0" to="38" dur="1.4s" repeatCount="indefinite"/></ellipse></svg></div>
      <div id="mark"></div>
    </div>
    <div id="petals"></div>
  </div>
  <!-- 战斗 -->
  <div class="layer" id="battle">
    <img class="bgimg" id="bgBattle" alt="城外竹林中的一片空地">
    <div class="layer" id="units"></div>
  </div>
  <canvas id="wx" width="720" height="1280"></canvas>
  <div class="shade"></div>

  <div class="ui" id="hud">
    <div class="plate"></div>
    <div class="face"><img id="hudFace" alt=""></div><div class="lv" id="hudLv"></div>
    <div class="who2"><div class="name" id="hudName">云中客</div><div class="sect" id="hudSect">游侠</div></div>
    <div class="bar" id="hp"><i></i><b></b></div>
    <div class="bar" id="mp"><i></i><b></b></div>
    <div class="pow">战力<b id="hudPow"></b></div>
    <button type="button" id="hudPet" aria-label="宠物"><img id="hudPetImg" alt=""><i>宠</i></button>
  </div>

  <div class="townui">
    <div class="ui" id="mini"><div class="map" id="miniMap"><div id="miniDots"></div><div class="me" id="me"></div></div><div class="n">北</div></div>
    <div class="ui" id="place"></div>
    <button type="button" class="ui" id="wxBtn" aria-label="天气"></button>
    <div class="ui" id="coin"></div>
    <div class="ui panel" id="quest" role="button" tabindex="0" aria-label="任务追踪，点击自动寻路">
      <h3><span class="on" data-qt="0">任务</span><span data-qt="1">队伍</span></h3>
      <div class="q cur"><em style="color:var(--amber)">[主线]</em> <span id="qTitle"></span><p id="qGoal"></p></div>
      <div class="q"><em style="color:var(--sky)">[历练]</em> 各地敌人<p id="qSide"></p></div>
      <div id="qParty" hidden></div>
    </div>
    <div class="ui panel" id="chat"><div id="chatLog"></div><div class="in">点这里聊天…</div><i id="chatDot" hidden></i></div>
    <div class="ui" id="notice" hidden><b>公告</b><div class="nr"><span id="noticeTxt"></span></div></div>
    <div class="ui" id="chatP" hidden>
      <div id="chatDim"></div>
      <div id="chatSheet">
        <div class="cp-head"><div id="chatTabs"></div><button type="button" id="chatX" aria-label="关闭">×</button></div>
        <div id="chatStrip" hidden></div>
        <div id="chatList"></div>
        <div id="chatHint"></div>
        <div id="chatPop" hidden></div>
        <form id="chatForm"><button type="button" id="chatCh">世界</button><button type="button" class="ib" id="chatEmo" aria-label="表情"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd24a" stroke="#b9750d" stroke-width="1.2"/><path d="M7.5 10q1.5-2 3 0M13.5 10q1.5-2 3 0M8 14.5q4 4 8 0" fill="none" stroke="#5a2d0a" stroke-width="1.6" stroke-linecap="round"/></svg></button><button type="button" class="ib" id="chatItem" aria-label="物品"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1 11H6z" fill="#c9884a" stroke="#6b3d14" stroke-width="1.2" stroke-linejoin="round"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="#6b3d14" stroke-width="1.4"/></svg></button><input id="chatInput" maxlength="40" autocomplete="off"><button type="submit" class="tbtn" id="chatSend">发送</button></form>
      </div>
      <div id="chatMenu" hidden></div>
    </div>
    <div id="btns"></div>
  </div>

  <div class="fightui">
    <div class="ui" id="bmsg"></div>
    <div class="ui" id="bturn"><b id="bclock"></b><span id="bround"></span></div>
    <div class="ui bname" id="bnameE"></div><div class="ui bname" id="bnameA"></div>
    <div class="ui" id="cmd">
      <div id="cmdTip"></div>
      <div id="cmdList"></div>
      <div id="cmdBtns"></div>
    </div>
  </div>
  <div class="ui" id="exp"><i id="expBar"></i></div>

  <div class="ui" id="toast" role="status"></div>
  <div class="ui panel" id="dialog" hidden><img id="dFace" alt=""><h4 id="dName"></h4><p id="dText"></p><small>点击继续 ▶</small></div>
  <div class="ui" id="smap" hidden>
    <h2 id="smapTitle"></h2><p id="smapSub"></p>
    <div id="smapBox"><img id="smapImg" alt="当前场景的地图"><div id="smapDots"></div></div>
    <div id="smapList"></div>
    <div id="smapBtns"><button type="button" class="tbtn" id="smapWorld">天下舆图</button><button type="button" class="tbtn" id="smapClose">返回</button></div>
  </div>
  <div class="ui" id="wmap" hidden><div id="wmapPan"><img id="wmapImg" alt="画在羊皮纸上的天下舆图"><div id="wmapNodes"></div></div><div id="wmapVig"></div><h2>天下舆图</h2><div id="wmapHint">拖动地图浏览 · 点击地点传送</div><button type="button" class="tbtn" id="wmapHome">回到当前</button><button type="button" class="tbtn" id="wmapClose">返回</button></div>
  <div class="ui" id="modal" hidden><div class="box"><h2 id="mTitle"></h2><button id="mClose" type="button" aria-label="关闭">×</button><div id="mBody"></div></div></div>

  <div class="ui" id="front">
    <img class="bgimg" id="frontBg" alt="月下，一名剑客站在悬崖上俯瞰灯火通明的秦都">
    <div class="fshade"></div>

    <section id="fLogin">
      <h1 class="logo">归秦</h1>
      <p class="slogan">大秦风云　侠义江湖</p>
      <form id="fLoginForm" class="fpanel" novalidate>
        <label for="fAccount">账号</label>
        <input id="fAccount" type="text" autocomplete="off" maxlength="16" placeholder="随便填一个，演示用">
        <label for="fPassword">密码</label>
        <input id="fPassword" type="password" autocomplete="off" maxlength="20" placeholder="不会校验">
        <label class="agree"><input type="checkbox" id="fAgree" checked> 我已阅读并同意《用户协议》和《隐私政策》</label>
        <p class="ferr" id="fLoginErr" role="alert"></p>
        <button class="fbtn" type="submit">登　录</button>
        <button class="flink" type="button" id="fGuest">游客试玩</button>
      </form>
      <p class="fnote">演示界面：账号和密码不会被校验、保存或上传</p>
    </section>

    <section id="fServer" hidden>
      <header class="fhead"><button type="button" class="fback" id="fBackLogin">‹ 返回</button><h2>选择区服</h2><span class="facc">账号　<b id="fWho"></b></span></header>
      <div id="fLast"></div>
      <div id="fTabs" class="ftabs"></div>
      <div id="fList"></div>
    </section>

    <section id="fRoles" hidden>
      <header class="fhead"><button type="button" class="fback" id="fBackServer">‹ 换区</button><h2 id="fSrvName"></h2><button type="button" class="fback right" id="fDel">删除角色</button></header>
      <div class="pedestal" style="top:790px"></div>
      <img class="fart" id="fRoleArt" alt="" style="top:200px;height:640px">
      <div class="rinfo"><h3 id="fRoleName"></h3><p id="fRoleInfo"></p></div>
      <div id="fSlots"></div>
      <button type="button" class="fbtn" id="fEnter" style="left:150px;top:1140px;width:420px">进入游戏</button>
      <div class="fpanel" id="fConfirmDel" hidden>
        <p>确定删除「<b id="fDelName"></b>」？<br>这个角色的等级、背包和任务进度会一起清掉。</p>
        <button type="button" class="fbtn small danger" id="fDelYes">删除</button><button type="button" class="fbtn small" id="fDelNo">保留</button>
      </div>
    </section>

    <section id="fCreate" hidden>
      <header class="fhead"><button type="button" class="fback" id="fBackRoles">‹ 返回</button><h2>创建角色</h2></header>
      <div id="fGender" class="ftabs"></div>
      <div class="pedestal" style="top:690px"></div>
      <img class="fart" id="fNewArt" alt="" style="top:176px;height:560px">
      <div id="fClasses"></div>
      <div class="cinfo"><h3><span id="fClsName"></span><small id="fClsRole"></small></h3><p id="fClsDesc"></p><div id="fStats"></div></div>
      <form id="fCreateForm" novalidate>
        <label for="fNewName" class="sr">角色名</label>
        <input id="fNewName" type="text" autocomplete="off" maxlength="6" placeholder="起个名字（2-6 字）">
        <button type="button" class="fbtn small plain" id="fDice">随机</button>
        <button type="submit" class="fbtn small">创建</button>
      </form>
      <p class="ferr" id="fNewErr" role="alert" style="position:absolute;left:0;right:0;top:1226px"></p>
    </section>
  </div>
</div></div>

<!--FRONT-->
<script src="js/assets.js"></script>
<script src="js/masks.js"></script>
<script src="js/water.js"></script>
<script src="js/data.js"></script>
<script src="js/story.js"></script>
<script src="js/chat.js"></script>
<script src="js/game.js"></script>
<script src="js/front.js"></script>

</body>
</html>
